name: Bug report
description: Something in @mtilabs/ui isn't working as expected
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal reproduction (StackBlitz/CodeSandbox link, or steps) — issues without one may be closed if the bug can't be confirmed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: '@mtilabs/ui version'
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and anything else relevant.
    validations:
      required: false
